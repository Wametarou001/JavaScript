<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- mathjsライブラリ -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/15.1.0/math.js">
        </script>

        <!-- Firebaseライブラリ -->
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
        </script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
        </script>

        <script src="./main.js" defer>
        </script>

        <title>
            Document
        </title>
    </head>
    <body>
        <!-- メモ -->
        <h1 id="title">
            良いね！悪いね！サイト
        </h1>

        <!-- ボタン1 -->
        <button id="iine_button">
            良いね！
        </button>

        <!-- ボタン2 -->
        <button id="waruine_button">
            悪いね！
        </button>

        <br>

        <div class="counter">
            <div>
                良いね！：<span id="iine_count">0</span>回
            </div>
            <div>
                悪いね！：<span id="waruine_count">0</span>回
            </div>
        </div>

        <br>

        <!-- 計算 -->
        <input type="text" id="num1">+<input type="text" id="num2">

        <button id="calc_button">
            計算
        </button>

        <br>

        結果：<span id="result">0</span>

        <footer style="margin-top: 40px; border-top: 1px solid #ccc; padding-top: 10px; font-size: 0.9em; color: #666;">
            <p>
                Created by わめ & 赤い人
            </p>
        </footer>
    </body>
</html>
