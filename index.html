<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="main.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/15.1.0/math.js"></script>

        <title>
            Document
        </title>
    </head>
    <body>
        <!-- メモ -->
        <h1 id="title">
            あああ
        </h1>

        <!-- ボタン1 -->
        <button id="button_1">
            良いね！
        </button>

        <!-- ボタン2 -->
        <button id="button_2">
            悪いね！
        </button>

        <!-- 計算 -->
        <input type="text" id="num1">
        +
        <input type="text" id="num2">
        <button id="calc_button">
            計算
        </button>
        <p>
            結果：
            <span id="result">
                0
            </span>
        </p>
        <script>
            // 処理
            const button_1 = document.getElementById('button_1');

            button_1.addEventListener('click', () =>
            {
                alert('良いね！');
            })

            // 計算処理
            const calcButton = document.getElementById('calc_button');

            calcButton.addEventListener('click', () =>
            {
                const a = document.getElementById('num1').value;
                const b = document.getElementById('num2').value;

                const valA = a ? math.evaluate(a) : 0;
                const valB = b ? math.evaluate(b) : 0;

                const result = valA + valB;

                document.getElementById('result').textContent = result;
            })
        </script>
    </body>
</html>
