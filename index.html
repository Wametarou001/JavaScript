<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- mathjsライブラリ -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/15.1.0/math.js">
        </script>

        <!-- Firebaseライブラリ -->
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
        </script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
        </script>

        <!-- css -->
        <link rel="stylesheet" href="/css/css.css">

        <!-- js -->
        <script src="/js/common/common.js">
        </script>
        <script type="module" src="/js/common/firebase.js">
        </script>
        <script type="module" src="/js/main/main.js">
        </script>
        <title>
            良いね悪いねサイト
        </title>

        <!-- Open Graph Protocol-->
        <!-- ページのタイトル名 -->
        <meta property="og:title" content="良いね悪いねサイト"/>
        <meta property="og:description" content="良いか悪いかを決めるサイトです。"/>
        <meta property="og:url" content="https://iine-waruine-site.pages.dev/"/>
        <!-- サムネ画像のURL -->
        <meta property="og:image" content="https://iine-waruine-site.pages.dev/png/iine.png"/>
        <meta property="og:type" content="website"/>
        <meta property="og:site_name" content="良いね悪いねサイト"/>
    </head>
    <body>
        <!-- ヘッダー -->
        <div id="header_container">
        </div>

        <main>
            <div>
                延べ訪問数：<span id="total_visit_count">0</span>
            </div>

            <br>

            <!-- ボタン1 -->
            <button id="iine_button">
                良いね！
            </button>

            <!-- ボタン2 -->
            <button id="waruine_button">
                悪いね！
            </button>

            <br>

            <div class="counter">
                <div>
                    良いね！：<span id="iine_count">0</span>
                </div>
                <div>
                    悪いね！：<span id="waruine_count">0</span>
                </div>
                <div>
                    良し悪し：<span id="yosiasi_count">0</span>
                </div>
            </div>

            <br>

            <!-- 計算 -->
            <input type="text" id="num1">

            <br>

            結果：<span id="result">0</span>

            <div>
                <h2>
                    今日の運勢
                </h2>
                <button id="omikuji_button">
                    おみくじを引く
                </button>
                <button id="reset_daikyo_button" style="display: none;">
                    見た目を元に戻す
                </button>
                <p>
                    結果：<span id="omikuji_result">???</span>
                </p>
                <p>
                <span id="omikuji_result_pts"></span>
                </p>
</div>

            <!-- チンチロ -->
            <h2>
                チンチロ
            </h2>
            <input type="text" id="chinchiro_bet" placeholder="賭けるポイント数">
            <button id="chinchiro_button">
                サイコロを振る
            </button>
            <div id="chinchiro_result">
                ここにサイコロの結果が出るよ
            </div>
            <div id="chinchiro_point_change">
                変動pt：なし
            </div>

            <!-- 1D100 -->
            <h2>
                なんでも1D100
            </h2>
            <input type="text" id="dice_input" placeholder="例: 1d100, 1d6+3">
            <button id="1d100_button">
                ダイスを振る
            </button>
            <span id="1d100_result">
            </span>

            <!-- 為替レート -->
            <h2>
                為替レート
            </h2>
            <div class="exchange_container">
                <div class="exchange_row">
                    <select id="from_currency" class="currency_select">
                        <option value="JPY" selected>JPY （日本円）</option>
                        <option value="USD">USD （米ドル）</option>
                    </select>

                    <input type="number" id="exchange_amount" class="amount_input" placeholder="換金する額を入力">
                </div>

                <div class="arrow_down">
                    ↓
                </div>

                <div class="exchange_row">
                    <select id="to_currency" class="currency_select">
                        <option value="JPY">JPY （日本円）</option>
                        <option value="USD" selected>USD （米ドル）</option>
                    </select>

                    <div class="result_box">
                        <span id="result_unit">$</span><span id="result_amount">0.00</span>
                    </div>

                    <button id="exchange_button" class="exchange_button">
                        変換
                    </button>
                </div>
            </div>

            <!-- ウォレット残高一覧 -->
            <div class="wallet_summary_container">
                <h3>
                    所持金一覧
                </h3>
                <p>
                    JPY：¥<span id="wallet_jpy">0</span>
                </p>
                <p>
                    USD：$<span id="wallet_usd">0</span>
                </p>
            </div>

            <br>

            <div class="navigation_button">
                <button id="next_button">
                    次のページ
                </button>
            </div>
        </main>

        <!-- フッター -->
        <div id="footer-container">
        </div>
    </body>
</html>
